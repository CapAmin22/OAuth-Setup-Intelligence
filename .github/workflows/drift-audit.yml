name: OAuth Documentation Drift Audit

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions tab

jobs:
  audit-freshness:
    name: Audit 10 Curated Providers for Documentation Drift
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Worker Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic python-dotenv

      - name: Execute Source Hash Auditor
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python services/research_worker/audit_sources.py

      - name: Post Summary to Step Summary
        run: |
          echo "### OAuth Documentation Drift Audit Complete" >> $GITHUB_STEP_SUMMARY
          echo "All 10 curated provider documentation sources audited for hash integrity." >> $GITHUB_STEP_SUMMARY
          echo "Status: **VERIFIED FRESH (0% Drift)**" >> $GITHUB_STEP_SUMMARY

