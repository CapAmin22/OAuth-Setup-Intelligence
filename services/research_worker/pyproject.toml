[project]
name = "oauth-setup-intelligence-worker"
version = "0.1.0"
description = "Research worker for autonomous OAuth setup guide generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

